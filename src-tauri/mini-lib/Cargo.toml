[package]
name = "phi-tk-mini-lib"
version = "1.2.1"
edition = "2021"
description = "Minimal render-only library for Phi-TK CLI, stripped of AI/preview/task management"

[lib]
name = "phi_tk_mini_lib"
crate-type = ["rlib"]

[dependencies]
ash = "0.38"
anyhow = { version = "1.0.70", features = ["backtrace"] }
macroquad = { git = "https://github.com/CMDBookDevelope/prpr-macroquad", default-features = false }
prpr = { git = "https://github.com/CMDBookDevelope/Phi-TKC-render-lib", package = "prpr", branch = "render-lib" }
sasa = { git = "https://github.com/Winamin/sasa" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.36.0", features = ["process", "rt-multi-thread", "fs"] }
tempfile = "3.8.0"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4"
colored = "2"
term_size = "0.3.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
